[package]
name = "tablex-cli"
description = "Command-line database client sharing Table X's drivers and streaming path"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The binary is `tablex`, not `tablex-cli`: the crate name disambiguates within
# the workspace, the command name is what people type.
[[bin]]
name = "tablex"
path = "src/main.rs"

[dependencies]
tablex-core.workspace = true
# Every driver, always. A CLI that had to be rebuilt with a different feature
# set to reach a different database would be a CLI nobody could ship a binary
# of, which is most of the point of having one.
tablex-drivers.workspace = true

anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
