[package]
name = "tablex-drivers"
description = "Database driver implementations for Table X"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tablex-core.workspace = true

async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
futures-util.workspace = true

# `bundled` compiles SQLite from source rather than linking the system copy.
# That keeps behaviour identical across Windows, Linux, macOS, iOS, and Android,
# where the system SQLite versions differ by years.
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"], optional = true }

tokio-postgres = { version = "0.7", optional = true, features = [
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }
postgres-protocol = { version = "0.6", optional = true }
# rustls rather than native-tls: no system OpenSSL dependency, which is what
# makes the Linux and mobile builds reproducible.
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = { version = "0.8", optional = true }

# `default-rustls-ring` rather than the default feature set: it swaps native-tls
# for rustls (no system OpenSSL) and pins the ring crypto provider, keeping the
# whole workspace on one backend — aws-lc-rs would drag NASM into the Windows
# build the way it did for russh.
mysql_async = { version = "0.37", optional = true, default-features = false, features = [
    "default-rustls-ring",
    "chrono",
] }

# `rustls` instead of the default `native-tls`, keeping one TLS stack across the
# workspace. `tds73` enables the modern date/time types; without it DATE and
# TIME come back as legacy DATETIME.
tiberius = { version = "0.12", optional = true, default-features = false, features = [
    "rustls",
    "tds73",
    "chrono",
    "winauth",
] }
tokio-util = { workspace = true, optional = true, features = ["compat"] }

# ClickHouse is driven over its HTTP interface rather than the `clickhouse`
# crate. That crate is row-oriented around serde derive, which needs the row
# shape at compile time — precisely what a client running arbitrary user SQL
# does not have. The HTTP endpoint's JSONCompact format returns column metadata
# alongside the data, which is exactly the dynamic shape this client needs.
#
# `rustls-no-provider` rather than `rustls`: in reqwest 0.13 the latter selects
# the aws-lc-rs backend, which needs NASM on Windows. This variant leaves the
# provider to the `rustls` dependency above, which is pinned to ring.
# No `http2`: ClickHouse's HTTP interface is a plain request/response endpoint
# with no multiplexing to gain from, and dropping it removes the whole h2 tree.
reqwest = { version = "0.13", optional = true, default-features = false, features = [
    "rustls-no-provider",
    "json",
    "gzip",
    "charset",
] }

[features]
default = ["postgres", "sqlite", "mysql", "mssql", "clickhouse"]
postgres = [
    "dep:tokio-postgres",
    "dep:postgres-protocol",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
]
sqlite = ["dep:rusqlite"]
mysql = ["dep:mysql_async"]
mssql = ["dep:tiberius", "dep:tokio-util"]
# Pulls `rustls` so the ring provider is compiled in; reqwest is built with
# `rustls-no-provider` and relies on it being the only one available.
clickhouse = ["dep:reqwest", "dep:rustls"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
# Only for building ConnectionConfig fixtures in tests; not needed at runtime.
indexmap.workspace = true
