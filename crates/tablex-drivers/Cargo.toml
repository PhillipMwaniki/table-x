[package]
name = "tablex-drivers"
description = "Database driver implementations for Table X"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tablex-core.workspace = true

async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
futures-util.workspace = true

# `bundled` compiles SQLite from source rather than linking the system copy.
# That keeps behaviour identical across Windows, Linux, macOS, iOS, and Android,
# where the system SQLite versions differ by years.
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"], optional = true }

tokio-postgres = { version = "0.7", optional = true, features = [
    "with-chrono-0_4",
    "with-uuid-1",
    "with-serde_json-1",
] }
postgres-protocol = { version = "0.6", optional = true }
# rustls rather than native-tls: no system OpenSSL dependency, which is what
# makes the Linux and mobile builds reproducible.
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = { version = "0.8", optional = true }

# `default-rustls-ring` rather than the default feature set: it swaps native-tls
# for rustls (no system OpenSSL) and pins the ring crypto provider, keeping the
# whole workspace on one backend — aws-lc-rs would drag NASM into the Windows
# build the way it did for russh.
mysql_async = { version = "0.37", optional = true, default-features = false, features = [
    "default-rustls-ring",
    "chrono",
] }

[features]
default = ["postgres", "sqlite", "mysql"]
postgres = [
    "dep:tokio-postgres",
    "dep:postgres-protocol",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
]
sqlite = ["dep:rusqlite"]
mysql = ["dep:mysql_async"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
# Only for building ConnectionConfig fixtures in tests; not needed at runtime.
indexmap.workspace = true
